<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Anyflix</title>
    <style>
      :root {
        --bg: #f6f6f8;
        --card: #ffffff;
        --border: rgba(20, 20, 30, 0.08);
        --text: #16161d;
        --muted: #6b6b78;
        --accent: #e50914;
        --accent-soft: rgba(229, 9, 20, 0.1);
        --ok: #1fa65a;
        --ok-soft: rgba(31, 166, 90, 0.14);
        --shadow: 0 1px 2px rgba(20, 20, 30, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121217;
          --card: #1c1c24;
          --border: rgba(255, 255, 255, 0.08);
          --text: #f3f3f7;
          --muted: #9494a3;
          --accent-soft: rgba(229, 9, 20, 0.18);
          --ok: #3ddc84;
          --ok-soft: rgba(61, 220, 132, 0.14);
          --shadow: none;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        background:
          radial-gradient(
            circle at 100% 0%,
            var(--accent-soft),
            transparent 55%
          ),
          var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.4;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      header img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--ok-soft);
        color: var(--ok);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 currentColor;
          opacity: 1;
        }
        50% {
          box-shadow: 0 0 0 4px transparent;
          opacity: 0.6;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .card h2 {
        margin: 0;
        padding: 10px 14px 6px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0 0 4px;
      }

      li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 14px;
      }

      .chip {
        flex: none;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
      }

      .name {
        font-weight: 600;
      }

      .what {
        color: var(--muted);
        font-size: 11.5px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <div>
        <h1>Anyflix</h1>
        <p class="tagline">Network request filtering</p>
      </div>
      <div class="status"><span class="dot"></span>Active</div>
    </header>

    <section class="card">
      <h2>Filtering</h2>
      <ul>
        <li>
          <span class="chip">N</span>
          <div>
            <div class="name">Netflix</div>
            <div class="what">Verification requests</div>
          </div>
        </li>
        <li>
          <span class="chip">A</span>
          <div>
            <div class="name">Allente</div>
            <div class="what">Session monitoring</div>
          </div>
        </li>
        <li>
          <span class="chip">TV2</span>
          <div>
            <div class="name">TV 2 Play</div>
            <div class="what">Ad media and telemetry</div>
          </div>
        </li>
        <li>
          <span class="chip">S</span>
          <div>
            <div class="name">Schibsted nettsider</div>
            <div class="what">Consent scripts</div>
          </div>
        </li>
      </ul>
    </section>

    <footer>
      <span>Reload open pages after updating</span>
      <span id="version"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
