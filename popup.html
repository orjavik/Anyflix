<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      margin: 0;
      /* Light mode */
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      color: #333;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #1a1a1a 0%, #2d1f1f 100%);
        color: #fff;
      }
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 20px;
      color: #e50914;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status {
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.4);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    @media (prefers-color-scheme: dark) {
      .status {
        background: rgba(229, 9, 20, 0.1);
        border: 1px solid rgba(229, 9, 20, 0.3);
      }
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #46d369;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .info {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    @media (prefers-color-scheme: dark) {
      .info {
        color: #888;
      }
    }

    .blocked-list {
      font-size: 11px;
      color: #555;
      margin-top: 8px;
      padding-left: 16px;
    }

    @media (prefers-color-scheme: dark) {
      .blocked-list {
        color: #666;
      }
    }
    .blocked-list li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <h1>🎬 Anyflix</h1>
  <div class="status">
    <div class="status-indicator">
      <div class="dot"></div>
      <span>Protection Active</span>
    </div>
  </div>
  <div class="info">
    <p>Protected services:</p>
    <ul class="blocked-list">
      <li>Netflix.com</li>
      <li>Allente.no</li>
    </ul>
    <p style="margin-top: 12px;">Refresh site to apply changes.</p>
  </div>
</body>
</html>
